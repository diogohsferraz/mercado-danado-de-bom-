name: App Android (maquininha PagBank)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME); o Gradle baixa a plataforma que faltar.
      - name: Conferir Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - name: Compilar APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: totem-danado-de-bom-apk
          path: android/app/build/outputs/apk/**/*.apk
