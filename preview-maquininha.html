<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preview · Maquininha Danado de Bom</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(900px 500px at 50% -10%, #2b1a0d, #0b0b0b 60%); color: #eee; font: 15px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 32px; gap: 14px; }
      h1 { margin: 0; font-size: 20px; color: #FF6B00; }
      p { margin: 0; color: #aaa; text-align: center; max-width: 560px; }
      .barra { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .barra button { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; background: #222; color: #ddd; }
      .barra button.ativo { background: #B8F400; color: #111; }
      /* Corpo da Smart 2: tela de ~5,5" (360 × 640 pontos) sobre a maquininha */
      .maquina { background: #1a1a1a; border-radius: 34px; padding: 14px 12px 70px; box-shadow: 0 20px 60px rgba(0,0,0,.7), inset 0 0 0 2px #333; position: relative; }
      .maquina::after { content: 'PagBank · Smart 2 (preview)'; position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; color: #555; font-size: 12px; letter-spacing: .08em; }
      .tela { width: 360px; height: 640px; border: 0; border-radius: 10px; background: #111; display: block; }
      @media (max-width: 420px) { .maquina { padding: 0; border-radius: 0; box-shadow: none; background: none; } .maquina::after { display: none; } .tela { width: 100vw; height: 82vh; border-radius: 0; } }
    </style>
  </head>
  <body>
    <h1>Preview do app da maquininha</h1>
    <p>Mesmo app que roda na Smart 2, com uma maquininha <b>simulada</b>: aprove ou recuse o pagamento no painel que aparece embaixo. Nada é cobrado nem enviado.</p>
    <div class="barra">
      <button data-rota="#/totem/loja1" class="ativo">Totem · Jardim das Palmeiras</button>
      <button data-rota="#/totem/loja3">Totem · Vila Farol</button>
      <button data-rota="#/admin/lojas">Painel na maquininha (PIN 1234)</button>
    </div>
    <div class="maquina"><iframe class="tela" title="Tela da maquininha" src="maquininha.html?simular=1#/totem/loja1"></iframe></div>
    <p>Dica: no celular, abra direto <a href="maquininha.html?simular=1#/totem/loja1" style="color:#B8F400">maquininha.html?simular=1</a>. Os dados de demonstração ficam neste navegador.</p>
    <script>
      const tela = document.querySelector('.tela');
      document.querySelectorAll('[data-rota]').forEach((b) =>
        b.addEventListener('click', () => {
          document.querySelectorAll('[data-rota]').forEach((x) => x.classList.toggle('ativo', x === b));
          tela.src = 'maquininha.html?simular=1' + b.dataset.rota;
        }),
      );
    </script>
  </body>
</html>
